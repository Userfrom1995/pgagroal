name: CI

on:
  push:
    branches:
      - master
      - 2.0.x
      - kqueue_flags
  pull_request:
    branches:
      - master
      - 2.0.x
      - kqueue_flags
  workflow_dispatch:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          sudo apt update -y
          sudo apt install -y lsb-release wget software-properties-common gnupg
          max_retries=5
          retry_delay=2
          tmp_key=$(mktemp)
          success=false
          
          for i in $(seq 1 $max_retries); do
            echo "Attempt $i of $max_retries to fetch LLVM GPG key..."
            if wget --timeout=10 --tries=1 -O "$tmp_key" https://apt.llvm.org/llvm-snapshot.gpg.key 2>&1; then
              echo "✓ Successfully fetched GPG key on attempt $i"
              success=true
              break
            else
              if [ $i -eq $max_retries ]; then
                echo "✗ Failed after $max_retries attempts"
                rm -f "$tmp_key"
                exit 1
              else
                echo "  Attempt $i failed, retrying in ${retry_delay}s..."
                sleep $retry_delay
                retry_delay=$((retry_delay * 2))
              fi
            fi
          done
          
          if [ "$success" = true ]; then
            cat "$tmp_key" | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
            rm -f "$tmp_key"
          fi
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt update -y
          sudo apt remove -y clang-format 2>/dev/null || true
          sudo apt install -y clang-format-21
          sudo ln -sf /usr/bin/clang-format-21 /usr/bin/clang-format

      - name: Check code formatting
        run: |
          ./clang-format.sh
          if ! git diff --quiet; then
            git diff
            echo ""
            echo "Please run './clang-format.sh' and commit the changes."
            exit 1
          fi

  build-linux:
    needs: [format-check]
    runs-on: ubuntu-latest
    container:
      image: rockylinux/rockylinux:10
      options: --security-opt seccomp=unconfined
    timeout-minutes: 30
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install epel-release
          dnf -y install \
            git gcc clang clang-tools-extra cmake make \
            openssl openssl-devel \
            systemd systemd-devel zlib zlib-devel \
            libzstd libzstd-devel lz4 lz4-devel \
            libatomic liburing liburing-devel \
            python3-docutils bzip2 bzip2-devel \
            check check-devel llvm \
            libasan libubsan \
            net-tools procps-ng \
            util-linux sudo which

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install PostgreSQL
        run: |
          dnf install -y https://download.postgresql.org/pub/repos/yum/reporpms/EL-10-x86_64/pgdg-redhat-repo-latest.noarch.rpm
          dnf -qy module disable postgresql 2>/dev/null || true
          dnf install -y postgresql17 postgresql17-server postgresql17-contrib postgresql17-libs postgresql17-devel

      - name: Set Env Path Variable for PostgreSQL
        run: |
          echo "PATH=/usr/pgsql-17/bin:$PATH" >> $GITHUB_ENV
          echo $PATH

      - name: Build Project
        run: |
          mkdir build
          cd build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=/usr/bin/gcc
          else
            export CC=/usr/bin/clang
          fi

          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDOCS=FALSE ..
           make -j$(nproc)

      - name: Create test user
        run: |
          useradd -m -s /bin/bash runner
          echo "runner ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R runner:runner $GITHUB_WORKSPACE

      - name: Testsuite
        id: test
        run: |
          # Ensure /tmp directories are writable by runner
          mkdir -p /tmp/pgagroal-test/log /tmp/pgagroal-test/pg_log /tmp/pgagroal-test/coverage
          chown -R runner:runner /tmp/pgagroal-test

          # Build the test command with appropriate env vars
          TEST_ENV="export PATH=/usr/pgsql-17/bin:\$PATH"

          if [ "${{ matrix.compiler }}" = "clang" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
            TEST_ENV="$TEST_ENV && export LLVM_PROFILE_FILE='/tmp/pgagroal-test/coverage/code-%p.profraw'"
          fi

          if [ "${{ matrix.compiler }}" = "gcc" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
            # On Rocky Linux, gcc -print-file-name=libasan.so returns a linker script stub.
            # Find the actual versioned DSO instead.
            ASAN_LIB=$(find /usr/lib64 -name 'libasan.so.*' -not -name '*.py' 2>/dev/null | head -1)
            if [ -n "$ASAN_LIB" ] && [ -f "$ASAN_LIB" ]; then
              echo "Using GCC AddressSanitizer preload: $ASAN_LIB"
              TEST_ENV="$TEST_ENV && export ASAN_OPTIONS=detect_leaks=0,verify_asan_link_order=0 && export LD_PRELOAD=$ASAN_LIB"
            fi
          fi

          su - runner -c "cd $GITHUB_WORKSPACE && $TEST_ENV && bash ./build/check.sh run-configs-ci-nonbuild"

      - name: Report coverage summary
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/pgagroal-test/coverage/coverage-report-*.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload All Coverage Reports as Artifact
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: /tmp/pgagroal-test/coverage
          retention-days: 90

      - name: Upload Build and Run Logs as Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
           ${{ github.workspace }}/log
           /tmp/pgagroal-test/*
          retention-days: 90

  build-macos:
    needs: [format-check]
    runs-on: macos-latest
    name: macOS (${{ matrix.build_type }}, ${{ matrix.pipeline }})
    timeout-minutes: 40
    strategy:
      matrix:
        build_type: [Debug, Release]
        pipeline: [performance, session, transaction]
      fail-fast: false
    env:
      PGAGROAL_ROOT: ${{ github.workspace }}
      BUILD_DIR: ${{ github.workspace }}/build
      POSTGRESQL_VERSION: "@17"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew update
          brew install openssl zstd lz4 libssh bzip2 docutils check graphviz doxygen

      - name: Configure and build with clang
        run: |
          export OPENSSL_ROOT_DIR=$(brew --prefix openssl)
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ..
          make -j$(sysctl -n hw.ncpu)

      - name: Install and start PostgreSQL
        run: |
          brew install postgresql${{ env.POSTGRESQL_VERSION }}
          PG_PREFIX=$(brew --prefix postgresql${{ env.POSTGRESQL_VERSION }})
          echo "$PG_PREFIX/bin" >> "$GITHUB_PATH"
          brew services start postgresql${{ env.POSTGRESQL_VERSION }}
          for i in $(seq 1 30); do
            if "$PG_PREFIX/bin/pg_isready" -h localhost -p 5432 >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready in time"
              exit 1
            fi
            sleep 1
          done

      - name: Run pgbench initialization tests (Direct and pgagroal)
        run: |
          PG_PREFIX=$(brew --prefix postgresql${{ env.POSTGRESQL_VERSION }})
          export PATH="$PG_PREFIX/bin:$PATH"

          # Setup test database and user
          psql -h localhost -p 5432 -U $(whoami) -d postgres -c "CREATE USER pgbench_user WITH PASSWORD 'pgbench_pass' SUPERUSER;" 2>/dev/null || psql -h localhost -p 5432 -U $(whoami) -d postgres -c "ALTER USER pgbench_user WITH PASSWORD 'pgbench_pass';"
          createdb -h localhost -p 5432 -U $(whoami) -O pgbench_user pgbench_test 2>/dev/null || true

          CONF_DIR="/tmp/pgagroal-macos-test"
          mkdir -p "$CONF_DIR"
          mkdir -m 0700 -p "$HOME/.pgagroal"
          chmod 0700 "$HOME/.pgagroal"

          run_with_timeout() {
            _timeout_sec="$1"
            shift
            if command -v timeout >/dev/null 2>&1; then
              timeout "$_timeout_sec" "$@"
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout "$_timeout_sec" "$@"
            else
              python3 -c "import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=int('$_timeout_sec')).returncode)" "$@"
            fi
          }

          FAILED_COUNT=0
          FAILED_NAMES=""

          run_pgbench_test() {
            _desc="$1"
            _host="$2"
            _port="$3"
            _scale="$4"
            _timeout_sec="$5"
            _is_pooler="$6"

            echo ""
            echo "================================================================================"
            echo ">>> [START] $_desc - Scale $_scale (Host: $_host, Port: $_port, Timeout: ${_timeout_sec}s)"
            echo "================================================================================"

            _start_time=$(date +%s)
            set +e
            run_with_timeout "$_timeout_sec" env PGPASSWORD=pgbench_pass pgbench -i -s "$_scale" -h "$_host" -p "$_port" -U pgbench_user -d pgbench_test
            _rc=$?
            set -e
            _end_time=$(date +%s)
            _duration=$((_end_time - _start_time))

            if [ $_rc -eq 0 ]; then
              echo "--------------------------------------------------------------------------------"
              echo ">>> [PASS] $_desc - Scale $_scale completed in ${_duration}s"
              echo "--------------------------------------------------------------------------------"
            elif [ $_rc -eq 124 ]; then
              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo ">>> [CRITICAL FAILURE: TIMEOUT] $_desc - Scale $_scale HUNG / TIMED OUT after ${_timeout_sec}s!"
              echo "    pgbench stalled without completing and was terminated."
              if [ "$_is_pooler" = "true" ]; then
                echo "    This indicates an event loop hang in pgagroal kqueue (e.g. EV_CLEAR issue #1067)."
                echo "    --- pgagroal status ---"
                "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping || true
                echo "    --- Recent pgagroal logs ---"
                tail -n 100 "$CONF_DIR/pgagroal.log" 2>/dev/null || true
              fi
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_NAMES="${FAILED_NAMES}  - [TIMEOUT] $_desc (Scale $_scale after ${_timeout_sec}s)\n"
            else
              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo ">>> [CRITICAL FAILURE: ERROR] $_desc - Scale $_scale FAILED with exit code $_rc in ${_duration}s!"
              if [ "$_is_pooler" = "true" ]; then
                echo "    --- pgagroal status ---"
                "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping || true
                echo "    --- Recent pgagroal logs ---"
                tail -n 100 "$CONF_DIR/pgagroal.log" 2>/dev/null || true
              fi
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_NAMES="${FAILED_NAMES}  - [FAILED] $_desc (Scale $_scale, Exit Code $_rc)\n"
            fi

            if [ "$_is_pooler" = "true" ] && [ $_rc -ne 0 ]; then
              echo ">>> Checking if pgagroal daemon is alive for subsequent tests..."
              if ! "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
                echo ">>> Restarting pgagroal daemon to allow subsequent tests to run independently..."
                kill -9 $PGAGROAL_PID 2>/dev/null || true
                sleep 1
                rm -f "$CONF_DIR/pgagroal.sock"
                "$BUILD_DIR/src/pgagroal" -c "$CONF_DIR/pgagroal.conf" -a "$CONF_DIR/pgagroal_hba.conf" -u "$CONF_DIR/pgagroal_users.conf" -l "$CONF_DIR/pgagroal_databases.conf" >> "$CONF_DIR/pgagroal.log" 2>&1 &
                PGAGROAL_PID=$!
                for _w in $(seq 1 10); do
                  if "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
                    echo ">>> pgagroal daemon ready after restart"
                    break
                  fi
                  sleep 1
                done
              fi
            fi
          }

          echo "================================================================================"
          echo "STEP 1: Direct PostgreSQL initialization tests (Baseline)"
          echo "================================================================================"
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 1 60 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 10 120 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 100 300 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 1000 900 false

          echo "================================================================================"
          echo "STEP 2: Configuring and starting pgagroal (${{ matrix.pipeline }} pipeline)"
          echo "================================================================================"
          printf "[pgagroal]\nhost = *\nport = 2345\n\nlog_type = console\nlog_level = info\n\nmax_connections = 100\nidle_timeout = 600\nvalidation = off\nunix_socket_dir = %s/\npipeline = %s\nallow_unknown_users = false\n\n[primary]\nhost = 127.0.0.1\nport = 5432\n" "$CONF_DIR" "${{ matrix.pipeline }}" > "$CONF_DIR/pgagroal.conf"

          printf "host all all all trust\n" > "$CONF_DIR/pgagroal_hba.conf"
          printf "pgbench_test pgbench_user 20 10 2\npostgres pgbench_user 20 10 2\n" > "$CONF_DIR/pgagroal_databases.conf"

          rm -f "$HOME/.pgagroal/master.key" "$CONF_DIR/pgagroal_users.conf"
          "$BUILD_DIR/src/pgagroal-admin" master-key -P pgbench_pass
          "$BUILD_DIR/src/pgagroal-admin" -f "$CONF_DIR/pgagroal_users.conf" -U pgbench_user -P pgbench_pass user add

          "$BUILD_DIR/src/pgagroal" -c "$CONF_DIR/pgagroal.conf" -a "$CONF_DIR/pgagroal_hba.conf" -u "$CONF_DIR/pgagroal_users.conf" -l "$CONF_DIR/pgagroal_databases.conf" > "$CONF_DIR/pgagroal.log" 2>&1 &
          PGAGROAL_PID=$!

          for i in $(seq 1 10); do
            if "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
              echo "pgagroal is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "pgagroal failed to start. Log:"
              cat "$CONF_DIR/pgagroal.log"
              exit 1
            fi
            sleep 1
          done

          echo "================================================================================"
          echo "STEP 3: Running pgbench through pgagroal pooler (${{ matrix.pipeline }} pipeline)"
          echo "================================================================================"
          run_pgbench_test "pgagroal pooler (${{ matrix.pipeline }})" 127.0.0.1 2345 1 60 true
          run_pgbench_test "pgagroal pooler (${{ matrix.pipeline }})" 127.0.0.1 2345 10 120 true
          run_pgbench_test "pgagroal pooler (${{ matrix.pipeline }})" 127.0.0.1 2345 100 300 true
          run_pgbench_test "pgagroal pooler (${{ matrix.pipeline }})" 127.0.0.1 2345 1000 900 true

          echo "================================================================================"
          echo "STEP 4: Shutting down pgagroal"
          echo "================================================================================"
          "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" shutdown || kill -9 $PGAGROAL_PID 2>/dev/null || true
          echo "--- Full pgagroal.log ---"
          cat "$CONF_DIR/pgagroal.log"

          if [ "$FAILED_COUNT" -ne 0 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo ">>> [CRITICAL SUITE FAILURE] $FAILED_COUNT test(s) FAILED:"
            printf "%b" "$FAILED_NAMES"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

          echo ""
          echo "================================================================================"
          echo ">>> [SUCCESS] All direct and pgagroal tests passed!"
          echo "================================================================================"

  build-freebsd:
    needs: [format-check]
    runs-on: ubuntu-latest
    name: FreeBSD (${{ matrix.build_type }}, ${{ matrix.pipeline }})
    timeout-minutes: 45
    strategy:
      matrix:
        compiler: [clang]
        build_type: [Debug, Release]
        pipeline: [performance, session, transaction]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            libvirt-daemon-system \
            libvirt-clients \
            bridge-utils
          sudo systemctl start libvirtd
      - name: Setup FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        id: freebsd-vm
        with:
          release: "14.4"
          usesh: true
          envs: "PATH,GITHUB_ENV,GITHUB_WORKSPACE,GITHUB_OUTPUT"
          mem: 4096
          sync: rsync
          copyback: true
          run: |
            # System bootstrap
            ASSUME_ALWAYS_YES=yes pkg bootstrap
            pkg update
            pkg upgrade -y
            # Base dependencies
            pkg install -y \
              bash \
              sudo \
              cmake \
              postgresql17-server \
              postgresql17-contrib \
              zstd \
              liblz4 \
              bzip2 \
              libssh \
              libarchive \
              check \
              py312-docutils \
              curl \
              doxygen \
              hs-pandoc \
              texlive-base \
              texlive-texmf \
              graphviz
            # Initialize Graphviz plugins after installation
            dot -c
      - name: Build Project
        shell: freebsd {0}
        run: |
          mkdir -p $GITHUB_WORKSPACE/build
          cd $GITHUB_WORKSPACE/build
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} "$GITHUB_WORKSPACE"
          make -j$(sysctl -n hw.ncpu)

      - name: Run pgbench initialization tests (Direct and pgagroal)
        shell: freebsd {0}
        run: |
          export PATH=/usr/local/bin:$PATH

          # Start PostgreSQL service on FreeBSD
          sysrc postgresql_enable="YES"
          service postgresql initdb || true
          service postgresql start || true

          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "PostgreSQL did not become ready in time"
              exit 1
            fi
            sleep 1
          done

          # Create test user and database
          su -m postgres -c "psql -h 127.0.0.1 -p 5432 -c \"CREATE USER pgbench_user WITH PASSWORD 'pgbench_pass' SUPERUSER;\"" 2>/dev/null || su -m postgres -c "psql -h 127.0.0.1 -p 5432 -c \"ALTER USER pgbench_user WITH PASSWORD 'pgbench_pass';\""
          su -m postgres -c "createdb -h 127.0.0.1 -p 5432 -O pgbench_user pgbench_test" 2>/dev/null || true

          # Create unprivileged runner user (pgagroal forbids running as root)
          id -u runner >/dev/null 2>&1 || pw useradd runner -m -s /bin/sh
          chown -R runner:runner "$GITHUB_WORKSPACE"
          mkdir -p /tmp/pgagroal-freebsd-test
          chown -R runner:runner /tmp/pgagroal-freebsd-test

          cat << 'SCRIPT_EOF' > /tmp/run_pgagroal_freebsd.sh
          #!/bin/sh
          set -e
          export PATH=/usr/local/bin:$PATH

          GITHUB_WORKSPACE="$1"
          PIPELINE="$2"
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          CONF_DIR="/tmp/pgagroal-freebsd-test"

          mkdir -p "$CONF_DIR"
          mkdir -m 0700 -p "$HOME/.pgagroal"
          chmod 0700 "$HOME/.pgagroal"

          run_with_timeout() {
            _timeout_sec="$1"
            shift
            if command -v timeout >/dev/null 2>&1; then
              timeout "$_timeout_sec" "$@"
            elif command -v gtimeout >/dev/null 2>&1; then
              gtimeout "$_timeout_sec" "$@"
            else
              python3 -c "import subprocess, sys; sys.exit(subprocess.run(sys.argv[1:], timeout=int('$_timeout_sec')).returncode)" "$@"
            fi
          }

          FAILED_COUNT=0
          FAILED_NAMES=""

          run_pgbench_test() {
            _desc="$1"
            _host="$2"
            _port="$3"
            _scale="$4"
            _timeout_sec="$5"
            _is_pooler="$6"

            echo ""
            echo "================================================================================"
            echo ">>> [START] $_desc - Scale $_scale (Host: $_host, Port: $_port, Timeout: ${_timeout_sec}s)"
            echo "================================================================================"

            _start_time=$(date +%s)
            set +e
            run_with_timeout "$_timeout_sec" env PGPASSWORD=pgbench_pass pgbench -i -s "$_scale" -h "$_host" -p "$_port" -U pgbench_user -d pgbench_test
            _rc=$?
            set -e
            _end_time=$(date +%s)
            _duration=$((_end_time - _start_time))

            if [ $_rc -eq 0 ]; then
              echo "--------------------------------------------------------------------------------"
              echo ">>> [PASS] $_desc - Scale $_scale completed in ${_duration}s"
              echo "--------------------------------------------------------------------------------"
            elif [ $_rc -eq 124 ]; then
              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo ">>> [CRITICAL FAILURE: TIMEOUT] $_desc - Scale $_scale HUNG / TIMED OUT after ${_timeout_sec}s!"
              echo "    pgbench stalled without completing and was terminated."
              if [ "$_is_pooler" = "true" ]; then
                echo "    This indicates an event loop hang in pgagroal kqueue (e.g. EV_CLEAR issue #1067)."
                echo "    --- pgagroal status ---"
                "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping || true
                echo "    --- Recent pgagroal logs ---"
                tail -n 100 "$CONF_DIR/pgagroal.log" 2>/dev/null || true
              fi
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_NAMES="${FAILED_NAMES}  - [TIMEOUT] $_desc (Scale $_scale after ${_timeout_sec}s)\n"
            else
              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo ">>> [CRITICAL FAILURE: ERROR] $_desc - Scale $_scale FAILED with exit code $_rc in ${_duration}s!"
              if [ "$_is_pooler" = "true" ]; then
                echo "    --- pgagroal status ---"
                "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping || true
                echo "    --- Recent pgagroal logs ---"
                tail -n 100 "$CONF_DIR/pgagroal.log" 2>/dev/null || true
              fi
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              FAILED_COUNT=$((FAILED_COUNT + 1))
              FAILED_NAMES="${FAILED_NAMES}  - [FAILED] $_desc (Scale $_scale, Exit Code $_rc)\n"
            fi

            if [ "$_is_pooler" = "true" ] && [ $_rc -ne 0 ]; then
              echo ">>> Checking if pgagroal daemon is alive for subsequent tests..."
              if ! "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
                echo ">>> Restarting pgagroal daemon to allow subsequent tests to run independently..."
                kill -9 $PGAGROAL_PID 2>/dev/null || true
                sleep 1
                rm -f "$CONF_DIR/pgagroal.sock"
                "$BUILD_DIR/src/pgagroal" -c "$CONF_DIR/pgagroal.conf" -a "$CONF_DIR/pgagroal_hba.conf" -u "$CONF_DIR/pgagroal_users.conf" -l "$CONF_DIR/pgagroal_databases.conf" >> "$CONF_DIR/pgagroal.log" 2>&1 &
                PGAGROAL_PID=$!
                for _w in $(seq 1 10); do
                  if "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
                    echo ">>> pgagroal daemon ready after restart"
                    break
                  fi
                  sleep 1
                done
              fi
            fi
          }

          echo "================================================================================"
          echo "STEP 1: Direct PostgreSQL initialization tests (Baseline)"
          echo "================================================================================"
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 1 60 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 10 120 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 100 300 false
          run_pgbench_test "Direct PostgreSQL" 127.0.0.1 5432 1000 900 false

          echo "================================================================================"
          echo "STEP 2: Configuring and starting pgagroal ($PIPELINE pipeline)"
          echo "================================================================================"
          printf "[pgagroal]\nhost = *\nport = 2345\n\nlog_type = console\nlog_level = info\n\nmax_connections = 100\nidle_timeout = 600\nvalidation = off\nunix_socket_dir = %s/\npipeline = %s\nallow_unknown_users = false\n\n[primary]\nhost = 127.0.0.1\nport = 5432\n" "$CONF_DIR" "$PIPELINE" > "$CONF_DIR/pgagroal.conf"

          printf "host all all all trust\n" > "$CONF_DIR/pgagroal_hba.conf"
          printf "pgbench_test pgbench_user 20 10 2\npostgres pgbench_user 20 10 2\n" > "$CONF_DIR/pgagroal_databases.conf"

          rm -f "$HOME/.pgagroal/master.key" "$CONF_DIR/pgagroal_users.conf"
          "$BUILD_DIR/src/pgagroal-admin" master-key -P pgbench_pass
          "$BUILD_DIR/src/pgagroal-admin" -f "$CONF_DIR/pgagroal_users.conf" -U pgbench_user -P pgbench_pass user add

          "$BUILD_DIR/src/pgagroal" -c "$CONF_DIR/pgagroal.conf" -a "$CONF_DIR/pgagroal_hba.conf" -u "$CONF_DIR/pgagroal_users.conf" -l "$CONF_DIR/pgagroal_databases.conf" > "$CONF_DIR/pgagroal.log" 2>&1 &
          PGAGROAL_PID=$!

          for i in $(seq 1 10); do
            if "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" ping >/dev/null 2>&1; then
              echo "pgagroal is ready"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "pgagroal failed to start. Log:"
              cat "$CONF_DIR/pgagroal.log"
              exit 1
            fi
            sleep 1
          done

          echo "================================================================================"
          echo "STEP 3: Running pgbench through pgagroal pooler ($PIPELINE pipeline)"
          echo "================================================================================"
          run_pgbench_test "pgagroal pooler ($PIPELINE)" 127.0.0.1 2345 1 60 true
          run_pgbench_test "pgagroal pooler ($PIPELINE)" 127.0.0.1 2345 10 120 true
          run_pgbench_test "pgagroal pooler ($PIPELINE)" 127.0.0.1 2345 100 300 true
          run_pgbench_test "pgagroal pooler ($PIPELINE)" 127.0.0.1 2345 1000 900 true

          echo "================================================================================"
          echo "STEP 4: Shutting down pgagroal"
          echo "================================================================================"
          "$BUILD_DIR/src/pgagroal-cli" -c "$CONF_DIR/pgagroal.conf" shutdown || kill -9 $PGAGROAL_PID 2>/dev/null || true
          echo "--- Full pgagroal.log ---"
          cat "$CONF_DIR/pgagroal.log"

          if [ "$FAILED_COUNT" -ne 0 ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo ">>> [CRITICAL SUITE FAILURE] $FAILED_COUNT test(s) FAILED:"
            printf "%b" "$FAILED_NAMES"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            exit 1
          fi

          echo ""
          echo "================================================================================"
          echo ">>> [SUCCESS] All direct and pgagroal tests passed!"
          echo "================================================================================"
          SCRIPT_EOF

          chmod +x /tmp/run_pgagroal_freebsd.sh
          chown runner:runner /tmp/run_pgagroal_freebsd.sh
          su - runner -c "/tmp/run_pgagroal_freebsd.sh '$GITHUB_WORKSPACE' '${{ matrix.pipeline }}'"


  build-rpm:
    needs: [format-check]
    uses: ./.github/workflows/rpm-build.yml
